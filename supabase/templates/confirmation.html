<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Xác nhận tài khoản Vivu</title>
</head>
<body style="margin:0;padding:0;background:#eef4fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef4fa;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;">
          <tr>
            <td style="background:#0A192F;padding:28px 24px;text-align:center;">
              <img src="{{ .SiteURL }}/images/vivu-logo-email.png" alt="Vivu Travel" width="96" height="36" style="display:block;margin:0 auto;border:0;height:auto;"/>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px 28px;">
              <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;color:#0f172a;line-height:1.3;">Xác nhận email của bạn</h1>
              <p style="margin:0 0 28px;font-size:15px;line-height:1.65;color:#64748b;">
                Cảm ơn bạn đã gia nhập <strong style="color:#0f172a;">Vivu Travel</strong>.
                Nhấn nút bên dưới để xác nhận <strong style="color:#0f172a;">{{ .Email }}</strong> và bắt đầu khám phá tour di sản.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0068c3;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:14px 36px;border-radius:8px;">Xác nhận email</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px;font-size:12px;line-height:1.5;color:#94a3b8;text-align:center;border-top:1px solid #f1f5f9;">
              <p style="margin:20px 0 0;">Không phải bạn đăng ký? Hãy bỏ qua email này.</p>
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0;font-size:11px;color:#94a3b8;">Vivu Travel · Hành trình di sản</p>
      </td>
    </tr>
  </table>
</body>
</html>
